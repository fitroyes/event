[[event]]
path = "adelphes"
name = "“Joyeuses Luttes !” - Repas partagé et journée festive aux Adelphes"
desc = "Une journée pour se retrouver, partager… et célébrer nos luttes\u202F! les Adelphes vous donnent rendez-vous pour une journée placée sous le signe de la joie, de la convivialité et du collectif"
